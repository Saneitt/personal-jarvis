name: Windows checks and download
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Test local behavior
        run: |
          python -m pytest tests -q
          node --test tests/audio-player.test.cjs
      - name: Build Windows app
        shell: powershell
        run: ./scripts/build_desktop.ps1
      - name: Package download
        run: python scripts/package_release.py --with-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalJarvis-Windows
          path: dist/*
      - name: Publish versioned download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py
