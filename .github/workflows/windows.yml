name: Windows checks and download
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Test local behavior
        run: |
          python -m pytest tests -q
          node --test tests/audio-player.test.cjs
      - name: Build Windows app
        shell: powershell
        run: ./scripts/build_desktop.ps1
      - name: Package download
        run: python scripts/package_release.py --with-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalJarvis-Windows
          path: dist/*
      - name: Publish versioned download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $version=(Get-Content VERSION).Trim()
          $tag="v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Personal Jarvis $version" --notes "Local Windows voice assistant. Download the Windows ZIP, extract it, and run Setup Jarvis.cmd to choose and download a local model. Models and personal data are not included."
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $tag dist/*.zip dist/*.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
